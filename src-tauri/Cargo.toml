[package]
name = "lite-editor"
version = "0.1.0"
edition = "2021"
description = "Lightweight offline video editor"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
engine = { path = "../engine" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
