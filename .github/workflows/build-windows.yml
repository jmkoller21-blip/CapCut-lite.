name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch FFmpeg (LGPL build)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ffx
          $root = Get-ChildItem ffx -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Copy-Item "$($root.FullName)\bin\ffmpeg.exe" ffmpeg\
          Copy-Item "$($root.FullName)\bin\ffprobe.exe" ffmpeg\
          Copy-Item "$($root.FullName)\LICENSE.txt" ffmpeg\
          Get-ChildItem ffmpeg | Format-Table Name, Length
          .\ffmpeg\ffmpeg.exe -hide_banner -encoders | Select-String "h264|libvpx|aac"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            src-tauri

      - name: Engine tests
        shell: pwsh
        continue-on-error: true
        env:
          LITE_FFMPEG_DIR: ${{ github.workspace }}\ffmpeg
        run: cargo test --manifest-path engine/Cargo.toml

      - name: Build installer
        shell: pwsh
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - name: Show installer
        shell: pwsh
        run: Get-ChildItem src-tauri\target\release\bundle\nsis | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: lite-editor-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lite Editor build ${{ github.run_number }}
          prerelease: true
          files: src-tauri/target/release/bundle/nsis/*.exe
