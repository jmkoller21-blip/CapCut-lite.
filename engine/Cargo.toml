[package]
name = "engine"
version = "0.1.0"
edition = "2021"
description = "Lightweight video editing engine (std only; drives a bundled FFmpeg process)"

[lib]
path = "src/lib.rs"

[[example]]
name = "devserver"
path = "examples/devserver.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
